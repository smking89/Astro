name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Prisma only needs a datasource URL to generate the client; nothing here connects.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/astro?schema=public
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate the Prisma client
        run: npx prisma generate --schema prisma/astro.prisma

      - name: Typecheck
        run: npm run typecheck
